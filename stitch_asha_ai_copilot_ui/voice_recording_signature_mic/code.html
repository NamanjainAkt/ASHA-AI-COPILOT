<script>
  (function initVoiceRecorder() {
    let seconds = 42;
    let isPaused = false;
    const timerEl = document.getElementById('recording-timer');
    const micBtn = document.getElementById('mic-trigger-btn');
    const micIcon = document.getElementById('mic-icon');

    // Live clock progression
    const interval = setInterval(() => {
      if (!isPaused && timerEl) {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }
    }, 1000);

    // Mic Pause / Resume toggle micro-interaction
    if (micBtn) {
      micBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          micIcon.textContent = 'play_arrow';
          micBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
        } else {
          micIcon.textContent = 'mic';
          micBtn.classList.replace('bg-tertiary-container', 'bg-primary-container');
        }
      });
    }
  })();
